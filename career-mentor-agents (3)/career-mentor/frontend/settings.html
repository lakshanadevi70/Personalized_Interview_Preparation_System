<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Guard: runs before anything renders. Bounces signed-out visitors to login.html.
if(!localStorage.getItem("cm_token")){ location.replace("login.html"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>
  <div>
    <div class="topbar" id="topbarSlot"></div>
    <div class="main">
      <div class="pagepane active fade-in">
        <h2 class="display" style="font-size:22px; margin-bottom:16px;">Settings</h2>
        <div class="card" style="max-width:480px; display:flex; flex-direction:column; gap:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center;"><span>Email</span><span id="settingsEmail" style="color:var(--mist);"></span></div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span>Career track</span>
            <select id="settingsTrack" class="focus-ring" style="background:var(--ink); border:1px solid var(--panelBorder); border-radius:8px; padding:8px 12px; color:inherit;" onchange="updateTrack(this.value)"></select>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;"><span>Theme</span><button class="btn-ghost focus-ring" onclick="toggleTheme()">Toggle light / dark</button></div>
          <button class="btn-ghost focus-ring" onclick="logout()" style="color:var(--danger); border-color:var(--danger);">Sign out</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  await safeRun('settings', loadSettings);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<script>
if(!localStorage.getItem("cm_token")){ location.replace("login.html"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload resume · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;">
  <div class="card fade-in" style="width:100%; max-width:520px;">
    <div class="mono" style="font-size:11px; color:var(--mist); margin-bottom:6px;">ONBOARDING · STEP 1</div>
    <h2 class="display" style="font-size:24px; margin-bottom:20px;">Upload your resume</h2>
    <div id="dropzone" style="border:2px dashed var(--panelBorder); border-radius:14px; padding:36px; text-align:center; cursor:pointer;" onclick="triggerFileSelect()">
      <div style="font-size:28px; margin-bottom:10px;">⬆</div>
      <div>Drop your resume here or browse</div>
      <div style="color:var(--mist); font-size:12px; margin-top:6px;">PDF, DOC or DOCX, max 10MB</div>
    </div>
    <input type="file" id="resumeFileInput" accept=".pdf,.doc,.docx" style="display:none">
    <div id="fileChip" style="display:none; align-items:center; justify-content:space-between; background:var(--ink); border-radius:10px; padding:10px 14px; margin-top:14px;">
      <span class="mono" id="fileChipName" style="font-size:13px;">resume.pdf</span>
      <span style="cursor:pointer; color:var(--mist);" onclick="resetUpload()">×</span>
    </div>
    <div id="progressBar" style="display:none; height:4px; background:var(--panelBorder); border-radius:2px; margin-top:12px; overflow:hidden;">
      <div id="progressFill" style="height:100%; width:0%; background:var(--ember); transition:width .3s linear;"></div>
    </div>
    <div id="parsedPreview" style="display:none; margin-top:20px;">
      <div class="mono" style="font-size:11px; color:var(--mist); text-transform:uppercase; margin-bottom:8px;">Skills detected</div>
      <div id="parsedSkills" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;"></div>
      <div class="mono" style="font-size:11px; color:var(--mist); text-transform:uppercase; margin-bottom:8px;">Resume score</div>
      <div id="parsedScore" class="display" style="font-size:22px;"></div>
    </div>
    <div class="err" id="uploadErr"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
      <a href="#" style="color:var(--mist); font-size:13px;" onclick="skipResume();return false;">I don't have a resume yet</a>
      <button id="continueBtn" class="btn-ember focus-ring" disabled onclick="location.href='profile.html'">Continue to profile</button>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/auth.js"></script>
<script>
  applySavedTheme();
  initResumeUpload();
</script>
</body>
</html>

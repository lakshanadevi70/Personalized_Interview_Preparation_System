<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Guard: runs before anything renders. Bounces signed-out visitors to login.html.
if(!localStorage.getItem("cm_token")){ location.replace("login.html"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>
  <div>
    <div class="topbar" id="topbarSlot"></div>
    <div class="main">
      <div class="pagepane active fade-in">
        <h2 class="display" style="font-size:22px; margin-bottom:16px;">Progress</h2>
        <div class="card" style="margin-bottom:18px; display:flex; align-items:center; gap:10px;">
          <span class="display" id="streakNum" style="font-size:30px; color:var(--ember);">–</span>
          <span style="color:var(--mist);">day streak 🔥</span>
        </div>
        <div class="grid grid-2">
          <div class="card"><div class="mono" style="font-size:11px; color:var(--mist);">QUIZ SCORES</div><div id="quizBars" style="height:60px; display:flex; align-items:flex-end; gap:6px; margin-top:12px;"></div></div>
          <div class="card"><div class="mono" style="font-size:11px; color:var(--mist);">INTERVIEW SCORES</div><div id="interviewBars" style="height:60px; display:flex; align-items:flex-end; gap:6px; margin-top:12px;"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  await safeRun('progress', loadProgress);
})();
</script>
</body>
</html>

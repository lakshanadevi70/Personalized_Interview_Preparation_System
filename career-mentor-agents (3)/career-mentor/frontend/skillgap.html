<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Guard: runs before anything renders. Bounces signed-out visitors to login.html.
if(!localStorage.getItem("cm_token")){ location.replace("login.html"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill gap · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>
  <div>
    <div class="topbar" id="topbarSlot"></div>
    <div class="main">
      <div class="pagepane active fade-in">
        <h2 class="display" style="font-size:22px; margin-bottom:6px;">Skill gap</h2>
        <div class="mono" id="skillgapNote" style="font-size:12px; color:var(--mist); margin-bottom:16px;"></div>
        <div class="grid grid-2" style="margin-bottom:18px;">
          <div class="card"><div class="mono" style="font-size:11px; color:var(--mist);">STRONG SKILLS</div><div id="strongSkills" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div></div>
          <div class="card"><div class="mono" style="font-size:11px; color:var(--mist);">MISSING SKILLS</div><div id="missingSkills" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div></div>
        </div>
        <div class="card">
          <div class="mono" style="font-size:11px; color:var(--mist); margin-bottom:8px;">ESTIMATED READINESS</div>
          <div style="height:10px; background:var(--panelBorder); border-radius:5px; overflow:hidden;"><div id="readinessBar" style="width:0%; height:100%; background:var(--ember);"></div></div>
          <div class="display" id="readinessPct" style="font-size:20px; margin-top:8px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  await safeRun('skillgap', loadSkillGap);
})();
</script>
</body>
</html>

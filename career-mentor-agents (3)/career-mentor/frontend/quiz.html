<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Guard: runs before anything renders. Bounces signed-out visitors to login.html.
if(!localStorage.getItem("cm_token")){ location.replace("login.html"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>
  <div>
    <div class="topbar" id="topbarSlot"></div>
    <div class="main">
      <div class="pagepane active fade-in">
        <h2 class="display" style="font-size:22px; margin-bottom:16px;">Practice · Quiz</h2>
        <div class="card" style="max-width:560px;">
          <p id="quizQuestion" style="margin-bottom:16px;"></p>
          <div id="quizOptions" style="display:flex; flex-direction:column; gap:8px;"></div>
          <div id="quizResult" style="margin-top:12px; font-size:13px;"></div>
          <button class="btn-ghost focus-ring" style="margin-top:12px;" onclick="loadQuiz()">Next question</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  await safeRun('quiz', loadQuiz);
})();
</script>
</body>
</html>

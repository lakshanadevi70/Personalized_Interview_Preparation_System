<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="fade-in" style="min-height:100vh; display:flex; align-items:stretch;">
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:60px; background:linear-gradient(180deg, var(--ink), #0d0d14); border-right:1px solid var(--panelBorder);">
    <div class="mono" style="font-size:12px; color:var(--mist); letter-spacing:.1em; margin-bottom:14px;">CAREER MENTOR</div>
    <h1 class="display" style="font-size:34px; line-height:1.3; margin-bottom:24px; max-width:420px;">Your path from <span class="display-i" style="color:var(--ember);">where you are</span> to your first offer.</h1>
    <div class="trail" style="margin-top:20px;">
      <div class="wp"><div class="wp-dot done"></div><div class="wp-label">Resume</div></div>
      <div class="wp-line done"></div>
      <div class="wp"><div class="wp-dot current pulse"></div><div class="wp-label">Skill gap</div></div>
      <div class="wp-line"></div>
      <div class="wp"><div class="wp-dot"></div><div class="wp-label">Roadmap</div></div>
      <div class="wp-line"></div>
      <div class="wp"><div class="wp-dot"></div><div class="wp-label">Interview</div></div>
      <div class="wp-line"></div>
      <div class="wp"><div class="wp-dot"></div><div class="wp-label">Offer</div></div>
    </div>
  </div>
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px;">
    <div class="card fade-in" style="width:100%; max-width:380px;">
      <h2 class="display" id="authTitle" style="font-size:22px; margin-bottom:6px;">Sign in</h2>
      <p style="color:var(--mist); font-size:13px; margin-bottom:22px;">Pick up your roadmap where you left off.</p>
      <label class="mono" style="font-size:11px; color:var(--mist); text-transform:uppercase;">Email</label>
      <input id="authEmail" class="focus-ring" style="width:100%; background:var(--ink); border:1px solid var(--panelBorder); border-radius:10px; padding:12px 14px; margin:8px 0 16px; color:inherit;" placeholder="you@example.com">
      <label class="mono" style="font-size:11px; color:var(--mist); text-transform:uppercase;">Password</label>
      <input type="password" id="authPassword" class="focus-ring" style="width:100%; background:var(--ink); border:1px solid var(--panelBorder); border-radius:10px; padding:12px 14px; margin:8px 0 8px; color:inherit;" placeholder="••••••••">
      <div id="trackField" style="display:none;">
        <label class="mono" style="font-size:11px; color:var(--mist); text-transform:uppercase;">Career track</label>
        <select id="authTrack" class="focus-ring" style="width:100%; background:var(--ink); border:1px solid var(--panelBorder); border-radius:10px; padding:12px 14px; margin:8px 0 8px; color:inherit;">
          <option value="tech">Tech</option>
          <option value="design">Design</option>
          <option value="marketing">Marketing</option>
        </select>
      </div>
      <div class="err" id="authErr"></div>
      <button class="btn-ember focus-ring" id="authSubmit" style="width:100%;" onclick="submitAuth()">Sign in</button>
      <p style="text-align:center; margin-top:16px; font-size:13px; color:var(--mist);">
        <span id="authToggleText">New here?</span>
        <a href="#" style="color:var(--ember);" onclick="toggleAuthMode();return false;" id="authToggleLink">Create an account</a>
      </p>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/auth.js"></script>
<script>
  applySavedTheme();
  redirectIfAlreadyAuthed();
</script>
</body>
</html>

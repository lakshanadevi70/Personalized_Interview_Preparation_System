<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Guard: runs before anything renders. Bounces signed-out visitors to login.html.
if(!localStorage.getItem("cm_token")){ location.replace("login.html"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview · Career Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>
  <div>
    <div class="topbar" id="topbarSlot"></div>
    <div class="main">
      <div class="pagepane active fade-in">
        <h2 class="display" style="font-size:22px; margin-bottom:16px;">Practice · Mock interview</h2>
        <div class="card" style="max-width:560px;">
          <div id="interviewQuestion" style="background:var(--ink); border-radius:12px; padding:14px; margin-bottom:14px; max-width:90%;"></div>
          <textarea id="interviewAnswer" class="focus-ring" style="width:100%; background:transparent; border:1px solid var(--panelBorder); border-radius:10px; padding:12px; color:inherit; min-height:80px;" placeholder="Type your answer..."></textarea>
          <button class="btn-ember focus-ring" style="margin-top:12px;" onclick="submitInterview()">Submit answer</button>
          <div id="interviewFeedback" style="margin-top:12px; font-size:13px; color:var(--mist);"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  await safeRun('interview', loadInterview);
})();
</script>
</body>
</html>
